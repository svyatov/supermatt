name: Skill idea
description: Propose a new skill or a change to how an existing skill works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong or takes too long today. Name the skill if one is involved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the skill should do instead.
    validations:
      required: true
