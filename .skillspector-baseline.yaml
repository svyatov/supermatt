version: 2

# CI scans each skill on its own, so paths are relative to one skill's
# directory. Every other finding is fixed at its source; this one is true and
# stays by design.

rules:
  - id: "AE1"
    path: "SKILL.md"
    message: "*scripts/mutate.sh (partial)*"
    reason: >-
      tdd: mutate.sh runs the caller's own BUILD and TEST strings through
      sh -c, so no static parser can see what they do. Running them is the
      script's purpose.
